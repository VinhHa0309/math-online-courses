# Server Configuration
server.port=8085
spring.application.name=math-courses-backend

# Tự động nạp profile local nếu có
spring.profiles.include=local

# PostgreSQL Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/math_courses_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Google OAuth2 Client ID
google.client.id=${GOOGLE_CLIENT_ID:748311830548-kn2es3vejt86ibtg3vkmfh2qk9quf48s.apps.googleusercontent.com}

# MoMo Payment Gateway Configurations
momo.partner-code=${MOMO_PARTNER_CODE:MOMOBKUN20180810}
momo.access-key=${MOMO_ACCESS_KEY:klm056ha5sHM2839}
momo.secret-key=${MOMO_SECRET_KEY:YOUR_MOMO_SECRET_KEY}
momo.endpoint=https://test-payment.momo.vn/v2/gateway/api/create
momo.redirect-url=http://localhost:5173/payment/result
momo.ipn-url=https://your-domain.ngrok-free.app/api/payment/momo-ipn

# ── Gmail SMTP ──
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8
